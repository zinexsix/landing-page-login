<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - M.Khairul Umardi Latif</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-icon">👋</div>
    <h2>Selamat Datang Kembali</h2>
    <p class="subtitle">Masuk ke akun kamu untuk melanjutkan</p>

    <form action="index.html">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="form-row">
        <label class="checkbox"><input type="checkbox"> Ingat saya</label>
        <a href="#">Lupa password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="switch">Belum punya akun? <a href="register.html">Register</a></p>
  </div>

  <a href="index.html" class="back-link">&larr; Kembali ke Beranda</a>

</body>
</html>
