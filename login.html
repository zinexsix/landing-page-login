<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - M.Khairul Umardi Latif</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h2>Login</h2>
    <p class="subtitle">Masukkan email dan password kamu</p>

    <form action="index.html">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="form-row">
        <label class="checkbox"><input type="checkbox"> Ingat saya</label>
        <a href="#">Lupa password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="switch">Belum punya akun? <a href="register.html">Register</a></p>
  </div>
</body>
</html>
